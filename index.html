<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>건프라 체크리스트 통합 메인</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --card-hover: #26354d;
    --border: #334155;
    --text: #f8fafc;
    --text-muted: #94a3b8;
    --accent: #38bdf8;
    --own-bg: rgba(34, 197, 94, 0.16);
    --own-border: #22c55e;
    --own-text: #4ade80;
    --miss-bg: rgba(239, 68, 68, 0.12);
    --miss-border: #ef4444;
    --miss-text: #f87171;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.4;
  }
  header {
    background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  }
  .header-top {
    max-width: 1400px;
    margin: 0 auto;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }
  .brand-row {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  h1 {
    margin: 0;
    font-size: 1.22rem;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .main-tabs {
    max-width: 1400px;
    margin: 12px auto 0;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    border-top: 1px solid rgba(51, 65, 85, 0.7);
    padding-top: 12px;
  }
  .tab-btn {
    background: #0f172a;
    color: var(--text-muted);
    border: 1.5px solid var(--border);
    padding: 8px 15px;
    border-radius: 8px;
    font-size: 0.88rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .tab-btn:hover {
    border-color: #64748b;
    color: #fff;
  }
  .tab-btn.active {
    background: linear-gradient(135deg, #2563eb 0%, #0284c7 100%);
    border-color: #38bdf8;
    color: #fff;
    box-shadow: 0 0 12px rgba(56, 189, 248, 0.35);
  }
  .tab-pill-cnt {
    font-size: 0.74rem;
    background: rgba(15, 23, 42, 0.65);
    padding: 1px 7px;
    border-radius: 999px;
    color: #7dd3fc;
  }
  .stats-bar {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .stat-pill {
    background: rgba(15, 23, 42, 0.8);
    border: 1px solid var(--border);
    padding: 5px 10px;
    border-radius: 7px;
    font-size: 0.82rem;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .stat-pill strong { font-size: 0.95rem; }
  .controls {
    max-width: 1400px;
    margin: 12px auto 0;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }
  input[type="text"], input[type="password"], select {
    background: #0f172a;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 7px 10px;
    border-radius: 7px;
    font-size: 0.85rem;
    outline: none;
  }
  input[type="text"]:focus, input[type="password"]:focus, select:focus {
    border-color: var(--accent);
  }
  input[type="text"] { flex: 1; min-width: 200px; }
  .btn {
    background: #334155;
    color: #fff;
    border: 1px solid #475569;
    padding: 7px 12px;
    border-radius: 7px;
    font-size: 0.82rem;
    cursor: pointer;
    font-weight: 600;
    transition: all 0.15s;
  }
  .btn:hover { background: #475569; }
  .btn-primary { background: #2563eb; border-color: #3b82f6; }
  .btn-primary:hover { background: #1d4ed8; }
  .btn-view.active { background: var(--accent); color: #0f172a; border-color: var(--accent); }

  main {
    max-width: 1400px;
    margin: 20px auto 60px;
    padding: 0 20px;
  }

  .series-section {
    margin-bottom: 42px;
  }
  .series-header {
    background: linear-gradient(90deg, rgba(37, 99, 235, 0.25) 0%, rgba(30, 41, 59, 0.95) 100%);
    border-left: 4px solid var(--accent);
    border-bottom: 1px solid var(--border);
    padding: 8px 14px;
    margin-bottom: 8px;
    border-radius: 6px;
    font-size: 0.96rem;
    font-weight: 800;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .series-header .count-badge {
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--accent);
    background: rgba(15, 23, 42, 0.75);
    padding: 2px 8px;
    border-radius: 999px;
    border: 1px solid rgba(56, 189, 248, 0.3);
  }


  /* Distinct color themes per lineup header box in Etc tab */
  .series-header.theme-re100 {
    background: linear-gradient(90deg, rgba(14, 165, 233, 0.30) 0%, rgba(30, 41, 59, 0.96) 100%);
    border-left-color: #38bdf8;
  }
  .series-header.theme-fm {
    background: linear-gradient(90deg, rgba(16, 185, 129, 0.28) 0%, rgba(30, 41, 59, 0.96) 100%);
    border-left-color: #34d399;
  }
  .series-header.theme-srw {
    background: linear-gradient(90deg, rgba(244, 63, 94, 0.28) 0%, rgba(30, 41, 59, 0.96) 100%);
    border-left-color: #fb7185;
  }
  .series-header.theme-hirm {
    background: linear-gradient(90deg, rgba(168, 85, 247, 0.28) 0%, rgba(30, 41, 59, 0.96) 100%);
    border-left-color: #c084fc;
  }

  /* Lineup group & sub-tier spacing */
  .lineup-block {
    margin-bottom: 64px;
  }
  .lineup-block:last-child {
    margin-bottom: 24px;
  }

  /* Style 1: Thin horizontal line + small centered/left label */
  .tier-line-divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 22px 0 10px;
    color: #94a3b8;
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.02em;
  }
  .tier-line-divider::before,
  .tier-line-divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, rgba(148,163,184,0.15), rgba(148,163,184,0.45), rgba(148,163,184,0.15));
  }
  .tier-line-divider.is-pb {
    color: #fbbf24;
  }
  .tier-line-divider.is-pb::before,
  .tier-line-divider.is-pb::after {
    background: linear-gradient(90deg, rgba(251,191,36,0.12), rgba(251,191,36,0.45), rgba(251,191,36,0.12));
  }
  .tier-line-divider .tier-cnt {
    font-size: 0.72rem;
    opacity: 0.8;
    font-weight: 600;
  }

  /* Style 2: Subtle slim sub-bar for Regular & P-Bandai */
  .tier-sub-bar {
    margin: 14px 0 8px;
    padding: 5px 11px;
    background: rgba(15, 23, 42, 0.55);
    border-left: 3px solid #64748b;
    border-bottom: 1px solid rgba(51, 65, 85, 0.7);
    border-radius: 0 5px 5px 0;
    color: #cbd5e1;
    font-size: 0.81rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .tier-sub-bar.is-pb {
    margin-top: 20px;
    border-left-color: #f59e0b;
    color: #fcd34d;
    background: rgba(245, 158, 11, 0.07);
  }
  .tier-sub-bar .tier-cnt {
    font-size: 0.73rem;
    color: #94a3b8;
    font-weight: 600;
  }

  /* Style 3: Unified Lineup Container Box */
  .lineup-container-box {
    background: rgba(15, 23, 42, 0.42);
    border: 1px solid rgba(51, 65, 85, 0.85);
    border-radius: 12px;
    padding: 14px 14px 18px;
    margin-bottom: 58px;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.22);
  }
  .lineup-container-box .series-header {
    margin-bottom: 12px;
  }
  .tier-inline-label {
    margin: 16px 0 8px;
    padding: 4px 2px;
    border-bottom: 1px dashed rgba(148, 163, 184, 0.35);
    color: #cbd5e1;
    font-size: 0.80rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .tier-inline-label.is-pb {
    margin-top: 22px;
    border-bottom-color: rgba(251, 191, 36, 0.35);
    color: #fcd34d;
  }
  .tier-inline-label .tier-cnt {
    font-size: 0.72rem;
    color: #94a3b8;
  }

  /* Subtle sub-header inside PG Regular for Custom Set */
  .sub-divider-header {
    margin: 18px 0 8px;
    padding: 5px 10px;
    border-top: 1px dashed rgba(148, 163, 184, 0.35);
    border-left: 2px solid #64748b;
    color: #94a3b8;
    font-size: 0.80rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(15, 23, 42, 0.35);
    border-radius: 0 5px 5px 0;
  }
  .sub-divider-header .sub-cnt {
    font-size: 0.72rem;
    color: #64748b;
  }

  .grid-container {
    display: grid;
    grid-template-columns: repeat(8, minmax(0, 1fr));
    gap: 10px;
  }
  @media (max-width: 1100px) {
    .grid-container {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }
  }
  @media (max-width: 600px) {
    .grid-container {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
  }
  .kit-card {
    background: var(--card);
    border: 1.6px solid var(--border);
    border-radius: 9px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
  }
  .kit-card:hover {
    border-color: #64748b;
    transform: translateY(-2px);
  }

  .photo-box {
    width: 100%;
    height: 185px;
    padding: 6px;
    background: #0b1120;
    border-bottom: 1px solid var(--border);
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: default;
    overflow: hidden;
    user-select: none;
  }
  .photo-box:hover { background: #131c31; }
  .photo-box img {
    width: auto;
    height: auto;
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    border-radius: 3px;
  }
  .photo-placeholder {
    text-align: center;
    color: var(--text-muted);
    font-size: 0.74rem;
    padding: 6px;
  }
  .photo-placeholder .icon { font-size: 1.5rem; display: block; margin-bottom: 4px; }
  .photo-actions {
    position: absolute;
    top: 5px;
    right: 5px;
    display: flex;
    gap: 3px;
    opacity: 0;
    transition: opacity 0.15s;
    z-index: 3;
  }
  .photo-box:hover .photo-actions { opacity: 1; }
  .mini-btn {
    background: rgba(15, 23, 42, 0.88);
    color: #fff;
    border: 1px solid #475569;
    border-radius: 4px;
    padding: 2px 5px;
    font-size: 0.68rem;
    cursor: pointer;
  }
  .mini-btn:hover { background: #ef4444; border-color: #ef4444; }
  .del-kit-btn {
    position: absolute;
    top: 5px;
    left: 5px;
    background: rgba(15, 23, 42, 0.88);
    color: #fca5a5;
    border: 1px solid rgba(239, 68, 68, 0.45);
    border-radius: 4px;
    padding: 2px 6px;
    font-size: 0.68rem;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.15s;
    z-index: 3;
  }
  .photo-box:hover .del-kit-btn { opacity: 1; }
  .del-kit-btn:hover { background: #ef4444; color: #fff; }

  .card-body {
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 5px;
    flex: 1;
  }
  .kit-name {
    font-weight: 700;
    font-size: 0.78rem;
    color: #fff;
    min-height: 2.6em;
    line-height: 1.3;
    word-break: keep-all;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .kit-name.pb-name {
    min-height: 3.9em;
    -webkit-line-clamp: 3;
  }
  .kit-meta {
    font-size: 0.68rem;
    color: var(--text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .status-group {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px;
    margin-top: auto;
  }
  .st-btn {
    border: 1px solid var(--border);
    background: #0f172a;
    color: var(--text-muted);
    padding: 4px 2px;
    border-radius: 5px;
    font-size: 0.72rem;
    font-weight: 700;
    cursor: pointer;
    text-align: center;
    white-space: nowrap;
  }
  .st-btn.active-own {
    background: var(--own-bg);
    border-color: var(--own-border);
    color: var(--own-text);
  }
  .st-btn.active-miss {
    background: var(--miss-bg);
    border-color: var(--miss-border);
    color: var(--miss-text);
  }
  .st-btn.active-wish {
    background: rgba(250, 204, 21, 0.18);
    border-color: #eab308;
    color: #facc15;
    cursor: default;
  }
  .st-btn.active-pass {
    background: rgba(148, 163, 184, 0.22);
    border-color: #94a3b8;
    color: #cbd5e1;
    cursor: default;
  }
  .kit-card.status-wish .st-btn:nth-child(2),
  .kit-card.status-pass .st-btn:nth-child(2),
  tr.row-wish .st-btn:nth-child(2),
  tr.row-pass .st-btn:nth-child(2) {
    cursor: default;
  }

  /* Card & table row states */
  .kit-card.status-own.build-done-photo .photo-box img {
    opacity: 0.35;
    filter: grayscale(32%);
  }
  tr.row-own.build-done-photo .tbl-photo img {
    opacity: 0.35;
    filter: grayscale(32%);
  }
  .kit-card.status-own {
    border: 2.4px solid var(--own-border);
    box-shadow: 0 0 12px rgba(34, 197, 94, 0.45), inset 0 0 0 1px rgba(34, 197, 94, 0.25);
  }
  .kit-card.status-miss {
    border: 1.6px solid var(--border);
    background: var(--card);
    box-shadow: none;
  }
  .kit-card.status-wish {
    border: 2.2px solid #eab308;
    background: rgba(250, 204, 21, 0.10);
    box-shadow: 0 0 12px rgba(250, 204, 21, 0.30);
  }
  .kit-card.status-wish .kit-name {
    font-weight: 900;
  }
  .kit-card.status-pass {
    border: 1.8px solid #64748b;
    background: rgba(100, 116, 139, 0.12);
    box-shadow: none;
  }
  .kit-card.status-pass .photo-box img,
  .kit-card.status-pass .kit-name,
  .kit-card.status-pass .kit-meta,
  .kit-card.status-pass .sub-row,
  .kit-card.status-pass .st-btn:not(.active-pass) {
    opacity: 0.20;
    filter: grayscale(65%);
  }
  .kit-card.status-pass .st-btn.active-pass {
    opacity: 1;
    filter: none;
  }
  .kit-card.status-pass .kit-name,
  .kit-card.status-pass .kit-meta {
    color: #94a3b8;
  }

  tr.row-wish {
    background: rgba(250, 204, 21, 0.09);
  }
  tr.row-wish td:first-child {
    box-shadow: inset 3.5px 0 0 #eab308;
  }
  tr.row-wish td:nth-child(2) {
    font-weight: 900;
  }
  tr.row-pass {
    background: rgba(100, 116, 139, 0.10);
    opacity: 0.20;
  }
  tr.row-pass td {
    color: #94a3b8;
  }

  .sub-row {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .sub-row select, .sub-row input {
    width: 100%;
    padding: 4px 6px;
    font-size: 0.72rem;
    border-radius: 5px;
    min-width: 0;
  }
  select.build-disabled, select:disabled {
    opacity: 0.32;
    cursor: not-allowed;
    background: rgba(15, 23, 42, 0.45);
    color: #64748b;
    border-color: rgba(51, 65, 85, 0.5);
  }
  select.is-placeholder { color: var(--text-muted); }
  select.build-done { color: #7dd3fc; }
  select.build-todo { color: #fcd34d; }
  select option { color: var(--text); background: #0f172a; }
  select option[value="-"] { color: var(--text-muted); }
  select option[value="조립"] { color: #7dd3fc; }
  select option[value="미조립"] { color: #fcd34d; }

  .table-wrap {
    overflow-x: auto;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.86rem;
  }
  th, td {
    padding: 9px 10px;
    border-bottom: 1px solid var(--border);
    text-align: left;
    vertical-align: middle;
  }
  th {
    background: #0f172a;
    color: var(--text-muted);
    font-weight: 700;
    white-space: nowrap;
  }
  tr.row-own {
    background: rgba(34, 197, 94, 0.10);
  }
  tr.row-own td:first-child {
    box-shadow: inset 3.5px 0 0 var(--own-border);
  }
  tr.row-own td {
    border-bottom-color: rgba(34, 197, 94, 0.35);
  }
  .tbl-photo {
    width: 84px;
    height: 64px;
    padding: 3px;
    background: #0b1120;
    border: 1px dashed #475569;
    border-radius: 7px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: default;
    overflow: hidden;
    position: relative;
    font-size: 0.7rem;
    color: var(--text-muted);
    text-align: center;
  }
  .tbl-photo img {
    width: auto;
    height: auto;
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }

  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(2, 6, 23, 0.78);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 999;
    padding: 16px;
  }
  .modal-backdrop.open { display: flex; }
  .modal-box {
    background: var(--card);
    border: 1px solid #475569;
    border-radius: 12px;
    width: 100%;
    max-width: 440px;
    padding: 20px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.6);
  }
  .modal-box h2 {
    margin: 0 0 14px 0;
    font-size: 1.08rem;
    color: #fff;
  }
  .form-group {
    display: flex;
    flex-direction: column;
    gap: 5px;
    margin-bottom: 12px;
  }
  .form-group label {
    font-size: 0.8rem;
    color: var(--text-muted);
    font-weight: 600;
  }
  .form-group input, .form-group select {
    width: 100%;
    padding: 8px 10px;
    font-size: 0.88rem;
  }
  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 16px;
  }

  @media print {
    header, .photo-actions, .btn { display: none !important; }
    body { background: #fff; color: #000; }
    .kit-card { border: 1px solid #ccc; break-inside: avoid; background: #fff; }
    .kit-name { color: #000; }
    .photo-box { background: #f8fafc; }
  }
</style>
</head>
<body>

<header>
  <div class="header-top">
    <div class="brand-row">
      <h1 id="pageMainTitle">MG 일반판 체크리스트</h1>
    </div>
    <div class="stats-bar" id="statsBar"></div>
  </div>

  <div class="main-tabs">
    <button class="tab-btn active" id="tabMg" onclick="switchTab('mg')">
      MG 일반판
      <span class="tab-pill-cnt" id="pillMg">0/0</span>
    </button>
    <button class="tab-btn" id="tabPbmg" onclick="switchTab('pbmg')">
      프반 MG
      <span class="tab-pill-cnt" id="pillPbmg">0/0</span>
    </button>
    <button class="tab-btn" id="tabPg" onclick="switchTab('pg')">
      PG
      <span class="tab-pill-cnt" id="pillPg">0/0</span>
    </button>
    <button class="tab-btn" id="tabEtc" onclick="switchTab('etc')">
      기타
      <span class="tab-pill-cnt" id="pillEtc">0/0</span>
    </button>
  </div>

  <div class="controls" id="listControls">
    <button class="btn btn-view active" id="btnGrid" onclick="setView('grid')">카드형 보기</button>
    <button class="btn btn-view" id="btnTable" onclick="setView('table')">리스트형 보기</button>
    <select id="statusFilter" onchange="render()">
      <option value="all">전체 상태 보기</option>
      <option value="own">✅ 보유 품목</option>
      <option value="miss">❌ 미보유 품목</option>
      <option value="wish">💙 위시 품목</option>
      <option value="pass">⏭️ 패쓰 품목</option>
    </select>

let mgOverrides = {};
let mgDeletedCodes = [];

function sanitizeTitleForFilename(name) {
  if (!name) return '';
  return name
    .replace(/[\\/:*?"<>|]/g, '_')
    .trim();
}

function isLegacyCgCode(code) {
  return typeof code === 'string' && code.startsWith('CG');
}

function getStoreForCode(tab, code) {
  if (tab === 'mg') return mgState;
  if (tab === 'pbmg' || isLegacyCgCode(code)) return pbState;
  return extraState;
}

function saveStoreForCode(tab, code) {
  if (tab === 'mg') saveMgData();
  else if (tab === 'pbmg' || isLegacyCgCode(code)) savePbData();
  else saveExtraData();
}

function getKitsForTab(tab) {
  if (tab === 'mg') {
    const delSet = new Set(mgDeletedCodes);
    const base = MG_DEFAULT_KITS
      .filter(k => !delSet.has(k.code))
      .map(k => mgOverrides[k.code] ? { ...k, ...mgOverrides[k.code] } : k);
    const custom = mgCustomKits.filter(k => !delSet.has(k.code));
    return [...base, ...custom];
  }
  if (tab === 'pbmg') {
    const pbMgCustom = pbCustomKits.filter(k => (k.series || 'MG') === 'MG');
    return [...PBMG_DEFAULT_KITS, ...pbMgCustom];
  }
  if (tab === 'pg') {
    const legacyPgCustom = pbCustomKits
      .filter(k => k.series === 'PG')
      .map(k => ({ ...k, group: 'PG : 프리미엄 반다이', folder: 'images/pbpg' }));
    const newPgCustom = extraCustomKits.filter(k => k.targetTab === 'pg');
    return [...PG_DEFAULT_KITS, ...legacyPgCustom, ...newPgCustom];
  }
  if (tab === 'etc') {
    const legacyReCustom = pbCustomKits
      .filter(k => k.series === 'RE/100')
      .map(k => ({ ...k, group: 'RE/100 : 프리미엄 반다이', folder: 'images/pbre100' }));
    const newEtcCustom = extraCustomKits.filter(k => k.targetTab === 'etc');
    return [...ETC_DEFAULT_KITS, ...legacyReCustom, ...newEtcCustom];
  }
  return [];
}

function getKitByCode(tab, code) {
  const kits = getKitsForTab(tab);
  return kits.find(item => item.code === code) || null;
}

const PHOTO_CANDIDATE_CACHE = new Map();

function getRepoPhotoCandidates(tab, code) {
  if (!code) return [];
  const kit = getKitByCode(tab, code);
  const rawName = kit ? kit.name : '';
  const folder = kit && kit.folder ? kit.folder : (tab === 'pbmg' ? 'images/pbmg' : 'images/mg');
  const cacheKey = `${tab}|${code}|${folder}|${rawName}`;
  if (PHOTO_CANDIDATE_CACHE.has(cacheKey)) {
    return PHOTO_CANDIDATE_CACHE.get(cacheKey);
  }
  const safeName = sanitizeTitleForFilename(rawName);
  const names = [];
  if (safeName) {
    names.push(safeName);
    const collapsed = safeName.replace(/\s+/g, ' ');
    if (collapsed !== safeName) names.push(collapsed);
  }
  if (!code.startsWith('CUSTOM_')) {
    names.push(code);
  }
  const exts = ['jpg', 'png', 'webp', 'JPG', 'PNG'];
  const list = [];
  for (const n of names) {
    const enc = encodeURIComponent(n);
    for (const ext of exts) {
      list.push(`${folder}/${enc}.${ext}`);
    }
  }
  PHOTO_CANDIDATE_CACHE.set(cacheKey, list);
  return list;
}

function getDefaultRepoPhotoPath(tab, code) {
  const c = getRepoPhotoCandidates(tab, code);
  return c.length ? c[0] : '';
}

function handleImgFallback(imgEl) {
  const rawList = imgEl.dataset.fallbacks || '';
  const list = rawList ? rawList.split('|').filter(Boolean) : [];
  if (list.length > 0) {
    const nextSrc = list.shift();
    imgEl.dataset.fallbacks = list.join('|');
    imgEl.src = nextSrc;
    return;
  }
  imgEl.style.display = 'none';
  if (imgEl.nextElementSibling) {
    imgEl.nextElementSibling.style.display = 'block';
  }
}

function getEffectivePhoto(tab, code, st) {
  if (st && st.photo) return st.photo;
  return getDefaultRepoPhotoPath(tab, code);
}

const KIT_DEFAULT_MEMO_MAP = { mg: new Map(), pbmg: new Map(), pg: new Map(), etc: new Map() };
function getDefaultMemo(tab, code) {
  let m = KIT_DEFAULT_MEMO_MAP[tab];
  if (!m) return '';
  if (!m.size) {
    const kits = getKitsForTab(tab);
    for (let i = 0; i < kits.length; i++) {
      if (kits[i].defaultMemo) m.set(kits[i].code, kits[i].defaultMemo);
    }
  }
  return m.get(code) || '';
}

function getKitState(tab, code) {
  const store = getStoreForCode(tab, code);
  if (!store[code]) {
    const initialNote = getDefaultMemo(tab, code);
    store[code] = { status: 'miss', build: '-', note: initialNote, photo: '' };
  }
  if (store[code].status !== 'own' && store[code].status !== 'miss' && store[code].status !== 'wish' && store[code].status !== 'pass') {
    store[code].status = 'miss';
  }
  if (store[code].build !== '조립' && store[code].build !== '미조립' && store[code].build !== '-') {
    store[code].build = '-';
  }
  return store[code];
}

function computeStats(tab) {
  const kits = getKitsForTab(tab);
  let own = 0, miss = 0;
  kits.forEach(k => {
    const st = getKitState(tab, k.code);
    if (st.status === 'own') own++;
    else miss++;
  });
  const total = kits.length;
  const pct = total > 0 ? ((own / total) * 100).toFixed(1) : '0.0';
  return { total, own, miss, pct };
}

function updateHeaderAndPills() {
  const mgStat = computeStats('mg');
  const pbmgStat = computeStats('pbmg');
  const pgStat = computeStats('pg');
  const etcStat = computeStats('etc');

  document.getElementById('pillMg').textContent = `${mgStat.own}/${mgStat.total}`;
  document.getElementById('pillPbmg').textContent = `${pbmgStat.own}/${pbmgStat.total}`;
  document.getElementById('pillPg').textContent = `${pgStat.own}/${pgStat.total}`;
  document.getElementById('pillEtc').textContent = `${etcStat.own}/${etcStat.total}`;

  const statMap = { mg: mgStat, pbmg: pbmgStat, pg: pgStat, etc: etcStat };
  const s = statMap[activeTab] || mgStat;

  document.getElementById('statsBar').innerHTML = `
    <div class="stat-pill">전체 <strong>${s.total}</strong></div>
    <div class="stat-pill" style="border-color:#22c55e;color:#4ade80;">보유 <strong>${s.own}</strong></div>
    <div class="stat-pill" style="border-color:#ef4444;color:#f87171;">미보유 <strong>${s.miss}</strong></div>
    <div class="stat-pill" style="border-color:#38bdf8;color:#38bdf8;">달성률 <strong>${s.pct}%</strong></div>
  `;
}

function applyStatusToElement(el, status, isRow) {
  if (!el) return;
  const st = getKitState(activeTab, el.dataset.code || '');
  const dimDone = (status === 'own' && st.build === '조립') ? 'build-done-photo' : '';
  if (isRow) {
    el.className = `${getRowStatusClass(status)} ${dimDone}`.trim();
  } else {
    el.className = `kit-card ${getCardStatusClass(status)} ${dimDone}`.trim();
  }
  const btns = el.querySelectorAll('.st-btn');
  if (btns[0]) {
    btns[0].className = `st-btn ${status === 'own' ? 'active-own' : (status === 'miss' ? 'active-miss' : '')}`;
    btns[0].textContent = status === 'own' ? '보유' : '미보유';
  }
  if (btns[1]) {
    btns[1].className = `st-btn ${status === 'wish' ? 'active-wish' : (status === 'pass' ? 'active-pass' : '')}`;
    btns[1].textContent = status === 'pass' ? '패쓰' : '위시';
  }
  const buildSel = el.querySelector('select');
  if (buildSel) {
    const canBuild = (status === 'own');
    buildSel.disabled = !canBuild;
    if (!canBuild) {
      buildSel.className = 'build-disabled';
    } else if (st.build === '-') {
      buildSel.className = 'is-placeholder';
    } else if (st.build === '조립') {
      buildSel.className = 'build-done';
    } else {
      buildSel.className = 'build-todo';
    }
  }
}

function updateItemStatusFast(tab, code, nextStatus, triggerBtn) {
  const item = getKitState(tab, code);
  item.status = nextStatus;
  saveStoreForCode(tab, code);

  const stFilter = document.getElementById('statusFilter').value;
  if (stFilter !== 'all' || !triggerBtn) {
    render();
    return;
  }

  const card = triggerBtn.closest('.kit-card');
  if (card) {
    applyStatusToElement(card, nextStatus, false);
  } else {
    const row = triggerBtn.closest('tr');
    if (row) applyStatusToElement(row, nextStatus, true);
  }
  updateHeaderAndPills();
}

function toggleOwnMiss(tab, code, btnEl) {
  const item = getKitState(tab, code);
  const next = (item.status === 'own') ? 'miss' : 'own';
  updateItemStatusFast(tab, code, next, btnEl);
}

function toggleWishPass(tab, code, btnEl) {
  const item = getKitState(tab, code);
  const next = (item.status === 'wish') ? 'pass' : 'wish';
  updateItemStatusFast(tab, code, next, btnEl);

  }
});

function processImageFile(file, tab, code) {
  const reader = new FileReader();
  reader.onload = function(evt) {
    const img = new Image();
    img.onload = function() {
      const maxDim = 360;
      let w = img.width;
      let h = img.height;
      if (w > maxDim || h > maxDim) {
        if (w > h) {
          h = Math.round(h * maxDim / w);
          w = maxDim;
        } else {
          w = Math.round(w * maxDim / h);
          h = maxDim;
        }
      }
      const canvas = document.createElement('canvas');
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.85);

      const item = getKitState(tab, code);
      item.photo = compressedDataUrl;
      saveStoreForCode(tab, code);
      render();
    };
    img.src = evt.target.result;
  };
  reader.readAsDataURL(file);
}

function removePhoto(e, tab, code) {
  e.stopPropagation();
  const item = getKitState(tab, code);
  item.photo = '';
  saveStoreForCode(tab, code);
  render();
}

function handleDrop(e, tab, code) {
  e.preventDefault();
  const file = e.dataTransfer.files[0];
  if (file && file.type.startsWith('image/')) {
    processImageFile(file, tab, code);
  }
}

function resolveFolderForGroup(tab, grp) {
  if (tab === 'mg') return 'images/mg';
  if (tab === 'pbmg') return 'images/pbmg';
  if (tab === 'pg') return grp.includes('프리미엄') ? 'images/pbpg' : 'images/pg';
  if (grp.startsWith('RE/100')) return grp.includes('프리미엄') ? 'images/pbre100' : 'images/re100';
  if (grp.startsWith('풀 메카닉스')) return grp.includes('프리미엄') ? 'images/pbfm' : 'images/fm';
  if (grp.startsWith('슈퍼로봇대전')) return grp.includes('프리미엄') ? 'images/pbsrw' : 'images/srw';
  return 'images/hirm';
}

function submitNewKit() {
  const name = document.getElementById('newKitName').value.trim();
  if (!name) {
    alert('모델명을 입력해 주세요.');
    document.getElementById('newKitName').focus();
    return;
  }
  const date = document.getElementById('newKitDate').value.trim();
  const code = 'CUSTOM_' + Date.now();

  if (activeTab === 'mg') {
    const series = document.getElementById('newKitSeries').value.trim() || '기타';
    mgCustomKits.push({ code, name, series, folder: 'images/mg', date: '', defaultMemo: date, isCustom: true });
    saveMgData();
  } else if (activeTab === 'pbmg') {
    const category = document.getElementById('newKitSeries').value.trim() || 'MG : 기타';
    pbCustomKits.push({ code, name, series: 'MG', category, folder: 'images/pbmg', date: '', defaultMemo: date, isCustom: true });
    savePbData();
  } else if (activeTab === 'pg') {
    const group = document.getElementById('newKitSeries').value.trim() || 'PG : 일반판';
    const folder = resolveFolderForGroup('pg', group);
    extraCustomKits.push({ code, name, series: 'PG', group, folder, targetTab: 'pg', date: '', defaultMemo: date, isCustom: true });
    saveExtraData();
  } else {
    const group = document.getElementById('newKitSeries').value.trim() || '하이 레졸루션';
    const series = group.split(':')[0].trim();
    const folder = resolveFolderForGroup('etc', group);
    extraCustomKits.push({ code, name, series, group, folder, targetTab: 'etc', date: '', defaultMemo: date, isCustom: true });
    saveExtraData();
  }
  closeAddModal();
  render();
  setTimeout(() => window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }), 80);
}

function deleteCustomKit(e, tab, code) {
  e.stopPropagation();
  if (!confirm('직접 추가한 이 제품 카드를 삭제할까요?')) return;
  if (tab === 'mg') {
    mgCustomKits = mgCustomKits.filter(k => k.code !== code);
    delete mgState[code];
    saveMgData();
  } else if (tab === 'pbmg') {
    pbCustomKits = pbCustomKits.filter(k => k.code !== code);
    delete pbState[code];
    savePbData();
  } else {
    extraCustomKits = extraCustomKits.filter(k => k.code !== code);
    delete extraState[code];
    saveExtraData();
  }
  render();
}

function formatKitTitle(tab, kit) {
  if (kit.displayHtml) return kit.displayHtml;
  return kit.name.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function getCardStatusClass(status) {
  if (status === 'own') return 'status-own';
  if (status === 'wish') return 'status-wish';
  if (status === 'pass') return 'status-pass';
  return 'status-miss';
}

function getRowStatusClass(status) {
  if (status === 'own') return 'row-own';
  if (status === 'wish') return 'row-wish';
  if (status === 'pass') return 'row-pass';
  return 'row-miss';
}

function renderCardHtml(tab, k) {
  const st = getKitState(tab, k.code);
  const cardCls = `${getCardStatusClass(st.status)} ${(st.status === 'own' && st.build === '조립') ? 'build-done-photo' : ''}`;
  const titleHtml = formatKitTitle(tab, k);
  const nameCls = (tab === 'pbmg' || kitNeedsThreeLines(k)) ? 'kit-name pb-name' : 'kit-name';
  const candidates = st.photo ? [] : getRepoPhotoCandidates(tab, k.code);
  const imgSrc = st.photo || candidates[0] || '';
  const fallbacksAttr = candidates.slice(1).join('|');
  const expectedPath = candidates[0] || '';
  const metaLabel = k.group || k.series || '';
  return `
    <div class="kit-card ${cardCls}" data-code="${k.code}">
      <div class="photo-box"
           ondragover="event.preventDefault()"
           ondrop="handleDrop(event, '${tab}', '${k.code}')">
        ${k.isCustom ? `<button class="del-kit-btn" onclick="deleteCustomKit(event, '${tab}', '${k.code}')">카드삭제</button>` : ''}
        ${imgSrc ? `
          <img src="${imgSrc}" data-fallbacks="${fallbacksAttr}" alt="${k.name}" onerror="handleImgFallback(this)">
          <div class="photo-placeholder" style="display:none;"><span class="icon">📷</span>사진 없음<br><span style="font-size:0.62rem;color:#64748b;">${expectedPath}</span></div>
          ${st.photo ? `<div class="photo-actions"><button class="mini-btn" onclick="removePhoto(event, '${tab}', '${k.code}')">삭제</button></div>` : ''}
        ` : `
          <div class="photo-placeholder">
            <span class="icon">📷</span>
            사진 추가
          </div>
        `}
      </div>
      <div class="card-body">
        <div class="${nameCls}" title="${k.name}">${titleHtml}</div>
        <div class="kit-meta" title="${metaLabel}">${metaLabel}</div>
        <div class="status-group">
          <button class="st-btn ${st.status==='own'?'active-own':(st.status==='miss'?'active-miss':'')}" onclick="toggleOwnMiss('${tab}','${k.code}', this)">${st.status==='own'?'보유':'미보유'}</button>
          <button class="st-btn ${st.status==='wish'?'active-wish':(st.status==='pass'?'active-pass':'')}" onclick="toggleWishPass('${tab}','${k.code}', this)">${st.status==='pass'?'패쓰':'위시'}</button>
        </div>
        <div class="sub-row">
          <select ${st.status!=='own'?'disabled':''} class="${st.status!=='own'?'build-disabled':(st.build==='-'?'is-placeholder':(st.build==='조립'?'build-done':'build-todo'))}" onchange="setBuild('${tab}','${k.code}', this.value, this)">
            <option value="-" ${st.build==='-'?'selected':''}>조립상태</option>
            <option value="조립" ${st.build==='조립'?'selected':''}>조립</option>
            <option value="미조립" ${st.build==='미조립'?'selected':''}>미조립</option>
          </select>
          <input type="text" placeholder="메모" value="${st.note.replace(/"/g, '&quot;')}" onchange="setNote('${tab}','${k.code}', this.value)">
        </div>
      </div>
    </div>
  `;
}

function kitNeedsThreeLines(k) {
  return (k.name && k.name.length > 22) || Boolean(k.displayHtml);
}

function renderGroupedByMissStatus(tab, list, isTable) {

    { key: 'pass', label: '패쓰' }
  ];
  let html = '';
  for (const g of groups) {
    const items = list.filter(item => getKitState(tab, item.code).status === g.key);
    if (items.length > 0) {
      if (isTable) {
        html += `
          <div class="series-section">
            <div class="series-header">
              <span>▶ ${g.label}</span>
              <span class="count-badge">${items.length}</span>

                    <th>보유 여부</th>
                    <th>조립 상태</th>
                    <th>메모</th>
                  </tr>
                </thead>
                <tbody>${items.map(k => renderTableRowHtml(tab, k)).join('')}</tbody>

            </div>
          </div>

      } else {
        html += `
          <div class="series-section">
            <div class="series-header">

            </div>

const VISUAL_STYLE = 1;

function renderLineupSectionHtml(lineupTitle, regItems, pbItems, subGroupConfig, themeClass) {
  const allItems = [...regItems, ...pbItems];
  if (allItems.length === 0) return '';
  const totalOwn = allItems.filter(i => getKitState(activeTab, i.code).status === 'own').length;

  const renderGridPart = (items) => {
    if (subGroupConfig && items.some(i => i.subGroup === subGroupConfig)) {
      const mainItems = items.filter(i => !i.subGroup);
      const subItems = items.filter(i => i.subGroup === subGroupConfig);
      return `
        <div class="grid-container">
          ${mainItems.map(k => renderCardHtml(activeTab, k)).join('')}
        </div>
        ${subItems.length > 0 ? `
          <div class="sub-divider-header">
            <span>${subGroupConfig}</span>
            <span class="sub-cnt">${subItems.length}종</span>
          </div>
          <div class="grid-container">
            ${subItems.map(k => renderCardHtml(activeTab, k)).join('')}
          </div>
        ` : ''}
      `;
    }
    return `
      <div class="grid-container">
        ${items.map(k => renderCardHtml(activeTab, k)).join('')}
      </div>
    `;
  };

  const renderTablePart = (items) => `
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>제품 사진</th>
            <th>모델명</th>
            <th>구분</th>
            <th>발매일 / 가격</th>
            <th>보유 여부</th>
            <th>조립 상태</th>
            <th>메모</th>
          </tr>
        </thead>
        <tbody>${items.map(k => renderTableRowHtml(activeTab, k)).join('')}</tbody>
      </table>
    </div>
  `;

  const renderPart = (items) => currentView === 'grid' ? renderGridPart(items) : renderTablePart(items);

  const regOwn = regItems.filter(i => getKitState(activeTab, i.code).status === 'own').length;
  const pbOwn = pbItems.filter(i => getKitState(activeTab, i.code).status === 'own').length;

  // Style 1: Thin horizontal line + label
  if (VISUAL_STYLE === 1) {
    let body = '';
    if (regItems.length > 0) {
      if (pbItems.length > 0) {
        body += `<div class="tier-line-divider"><span>일반판</span><span class="tier-cnt">보유 ${regOwn} / ${regItems.length}</span></div>`;
      }
      body += renderPart(regItems);
    }
    if (pbItems.length > 0) {
      body += `<div class="tier-line-divider is-pb"><span>프리미엄 반다이</span><span class="tier-cnt">보유 ${pbOwn} / ${pbItems.length}</span></div>`;
      body += renderPart(pbItems);
    }
    return `
      <div class="lineup-block">
        <div class="series-header ${themeClass || ''}">
          <span>▶ ${lineupTitle}</span>
          <span class="count-badge">보유 ${totalOwn} / ${allItems.length}</span>
        </div>
        ${body}
      </div>
    `;
  }

  // Style 2: Slim sub-bars for Regular & P-Bandai
  if (VISUAL_STYLE === 2) {
    let body = '';
    if (regItems.length > 0) {
      if (pbItems.length > 0) {
        body += `<div class="tier-sub-bar"><span>일반판</span><span class="tier-cnt">보유 ${regOwn} / ${regItems.length}</span></div>`;
      }
      body += renderPart(regItems);
    }
    if (pbItems.length > 0) {
      body += `<div class="tier-sub-bar is-pb"><span>프리미엄 반다이</span><span class="tier-cnt">보유 ${pbOwn} / ${pbItems.length}</span></div>`;
      body += renderPart(pbItems);
    }
    return `
      <div class="lineup-block">
        <div class="series-header ${themeClass || ''}">
          <span>▶ ${lineupTitle}</span>
          <span class="count-badge">보유 ${totalOwn} / ${allItems.length}</span>
        </div>
        ${body}
      </div>
    `;
  }

  // Style 3: Unified Lineup Container Box
  let body = '';
  if (regItems.length > 0) {
    if (pbItems.length > 0) {
      body += `<div class="tier-inline-label"><span>일반판</span><span class="tier-cnt">보유 ${regOwn} / ${regItems.length}</span></div>`;
    }
    body += renderPart(regItems);
  }
  if (pbItems.length > 0) {
    body += `<div class="tier-inline-label is-pb"><span>프리미엄 반다이</span><span class="tier-cnt">보유 ${pbOwn} / ${pbItems.length}</span></div>`;
    body += renderPart(pbItems);
  }
  return `
    <div class="lineup-container-box">
      <div class="series-header ${themeClass || ''}">
        <span>▶ ${lineupTitle}</span>
        <span class="count-badge">보유 ${totalOwn} / ${allItems.length}</span>
      </div>
      ${body}
    </div>
  `;
}

      if (!g.startsWith(lineFilter)) return false;
    }
    if (q) {
      const hay = `${k.name} ${k.group || ''} ${st.note}`.toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  if (stFilter === 'miss') {
    return renderGroupedByMissStatus('etc', filtered, currentView === 'table');
  }

  const lineups = [
    { title: 'RE/100', theme: 'theme-re100', reg: 'RE/100 : 일반판', pb: 'RE/100 : 프리미엄 반다이' },
    { title: '풀 메카닉스', theme: 'theme-fm', reg: '풀 메카닉스 : 일반판', pb: '풀 메카닉스 : 프리미엄 반다이' },
    { title: '슈퍼로봇대전', theme: 'theme-srw', reg: '슈퍼로봇대전 : 일반판', pb: '슈퍼로봇대전 : 프리미엄 반다이' },
    { title: '하이 레졸루션', theme: 'theme-hirm', reg: '하이 레졸루션', pb: null }
  ];

  return lineups.map(lu => {
    const regItems = filtered.filter(k => k.group === lu.reg);
    const pbItems = lu.pb ? filtered.filter(k => k.group === lu.pb) : [];
    return renderLineupSectionHtml(lu.title, regItems, pbItems, null, lu.theme);
  }).join('');
}

function render() {
  updateHeaderAndPills();
  const area = document.getElementById('contentArea');
  if (activeTab === 'pbmg') {
    area.innerHTML = renderPbmgList();
  } else if (activeTab === 'pg') {
    area.innerHTML = renderPgList();
  } else if (activeTab === 'etc') {
    area.innerHTML = renderEtcList();
  } else {
    area.innerHTML = renderMgList();
  }
}

function buildMgPayloadObj() {
  return {
    version: 8,
    updatedAt: new Date().toISOString(),
    state: mgState,
    customKits: mgCustomKits,
    kitOverrides: mgOverrides,
    deletedCodes: mgDeletedCodes
  };
}

function buildPbPayloadObj() {
  return {
    version: 8,
    updatedAt: new Date().toISOString(),
    state: pbState,
    customKits: pbCustomKits
  };
}

function buildExtraPayloadObj() {
  return {
    version: 8,
    updatedAt: new Date().toISOString(),
    state: extraState,
    customKits: extraCustomKits
  };
}

function buildUnifiedPayloadObj() {
  return {
    type: 'gunpla_unified_backup_v1',
    updatedAt: new Date().toISOString(),
    mg: buildMgPayloadObj(),
    pb: buildPbPayloadObj(),
    extra: buildExtraPayloadObj()
  };
}

function applyMgPayloadObj(parsed) {
  if (!parsed) return;
  if (parsed.state) {
    mgState = parsed.state;
    mgCustomKits = Array.isArray(parsed.customKits) ? parsed.customKits : [];
    mgOverrides = (parsed.kitOverrides && typeof parsed.kitOverrides === 'object') ? parsed.kitOverrides : {};
    mgDeletedCodes = Array.isArray(parsed.deletedCodes) ? parsed.deletedCodes : [];
  } else {
    mgState = parsed;
  }
  saveMgData();
}

function applyPbPayloadObj(parsed) {
  if (!parsed) return;
  if (parsed.state) {
    pbState = parsed.state;
    pbCustomKits = Array.isArray(parsed.customKits) ? parsed.customKits : [];
  } else {
    pbState = parsed;
  }
  savePbData();
}

function applyExtraPayloadObj(parsed) {
  if (!parsed) return;
  if (parsed.state) {
    extraState = parsed.state;
    extraCustomKits = Array.isArray(parsed.customKits) ? parsed.customKits : [];
  } else {
    extraState = parsed;
  }
  saveExtraData();
}

function applyUnifiedOrSingle(parsed) {
  if (!parsed) return false;
  if (parsed.type === 'gunpla_unified_backup_v1' || parsed.mg || parsed.pb || parsed.extra) {
    if (parsed.mg) applyMgPayloadObj(parsed.mg);
    if (parsed.pb) applyPbPayloadObj(parsed.pb);
    if (parsed.extra) applyExtraPayloadObj(parsed.extra);
    return true;
  }
  if (parsed.state) {
    const keys = Object.keys(parsed.state);
    const hasCg = keys.some(k => k.startsWith('CG'));
    const hasR = keys.some(k => k.startsWith('R'));
    if (hasCg && !hasR) applyPbPayloadObj(parsed);
    else applyMgPayloadObj(parsed);
    return true;
  }
  return false;
}

// GitHub Contents API Sync
function getGithubConfig() {
  let savedToken = '';
  try {
    const raw = localStorage.getItem(GH_CFG_KEY);
    if (raw) savedToken = (JSON.parse(raw).token || '').trim();
  } catch (e) {}
  return {
    token: ((DEFAULT_GH_TOKEN || '').trim() || savedToken),
    repo: DEFAULT_GH_REPO,
    path: DEFAULT_GH_PATH,
    branch: DEFAULT_GH_BRANCH
  };
}

function encodeBase64Utf8(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}

function decodeBase64Utf8(b64) {
  const clean = b64.replace(/\n/g, '');
  const bin = atob(clean);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

async function githubSaveAll() {
  const cfg = getGithubConfig();
  if (!cfg.token) {
    const entered = prompt('GitHub 토큰(github_pat_...)을 입력해 주세요. (이 브라우저에 임시 보관됩니다)');
    if (!entered || !entered.trim()) return;
    cfg.token = entered.trim();
    try { localStorage.setItem(GH_CFG_KEY, JSON.stringify({ token: cfg.token })); } catch (e) {}
  }
  try {
    const apiUrl = `https://api.github.com/repos/${cfg.repo}/contents/${cfg.path}`;
    let sha = undefined;
    const headRes = await fetch(`${apiUrl}?ref=${encodeURIComponent(cfg.branch)}`, {
      cache: 'no-store',
      headers: {
        'Authorization': `Bearer ${cfg.token}`,
        'Accept': 'application/vnd.github+json'
      }
    });
    if (headRes.ok) {
      const headJson = await headRes.json();
      sha = headJson.sha;
    }

    const contentStr = JSON.stringify(buildUnifiedPayloadObj(), null, 2);
    const putRes = await fetch(apiUrl, {
      method: 'PUT',
      headers: {
        'Authorization': `Bearer ${cfg.token}`,
        'Accept': 'application/vnd.github+json',
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        message: `Update gunpla checklist (${new Date().toISOString().slice(0, 19)})`,
        content: encodeBase64Utf8(contentStr),
        branch: cfg.branch,
        ...(sha ? { sha } : {})
      })
    });

    if (!putRes.ok) {
      const errBody = await putRes.text();
      throw new Error(`HTTP ${putRes.status}: ${errBody}`);
    }
    alert(`GitHub 저장소(${cfg.repo}/${cfg.path})에 저장했습니다.`);
  } catch (err) {
    alert('GitHub 저장 중 오류가 발생했습니다. 토큰 권한(Contents: Read and write)과 저장소 경로를 확인해 주세요.\n' + err.message);
  }
}

async function githubLoadAll() {
  const cfg = getGithubConfig();
  if (!cfg.token) {
    const entered = prompt('GitHub 토큰(github_pat_...)을 입력해 주세요. (이 브라우저에 임시 보관됩니다)');
    if (!entered || !entered.trim()) return;
    cfg.token = entered.trim();
    try { localStorage.setItem(GH_CFG_KEY, JSON.stringify({ token: cfg.token })); } catch (e) {}
  }
  try {
    const apiUrl = `https://api.github.com/repos/${cfg.repo}/contents/${cfg.path}?ref=${encodeURIComponent(cfg.branch)}`;
    const res = await fetch(apiUrl, {
      cache: 'no-store',
      headers: {
        'Authorization': `Bearer ${cfg.token}`,
        'Accept': 'application/vnd.github+json'
      }
    });
    if (!res.ok) {
      const errBody = await res.text();
      throw new Error(`HTTP ${res.status}: ${errBody}`);
    }
    const json = await res.json();
    const decoded = decodeBase64Utf8(json.content || '').trim();
    if (!decoded || decoded === '{}') {
      alert('저장소 data/checklist.json에 아직 저장된 데이터가 없습니다. 먼저 [GitHub 저장]을 눌러 주세요.');
      return;
    }
    const parsed = JSON.parse(decoded);
    if (applyUnifiedOrSingle(parsed)) {
      render();
      alert(`GitHub(${cfg.path})에서 데이터를 불러왔습니다.`);
    } else {
      alert('저장소 JSON 형식이 올바르지 않습니다.');
    }
  } catch (err) {
    alert('GitHub 불러오기 중 오류가 발생했습니다. 토큰 권한과 파일 경로를 확인해 주세요.\n' + err.message);
  }
}
